<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
    <style>
        /* --- Global Reset and Styling --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        /* --- OTP Container Styling --- */
        .otp-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
            transition: all 0.3s ease;
        }
        
        /* --- Info Div Styling --- */
        .info-div {
            background-color: #e9f5ff;
            color: #007bff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 5px solid #007bff;
            font-size: 14px;
            text-align: left;
        }

        /* --- Typography --- */
        h1 {
            color: #007bff;
            margin-bottom: 10px;
            font-size: 24px;
        }

        p.instruction {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        /* --- OTP Input Grid --- */
        .otp-input-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            gap: 10px; /* Spacing between input boxes */
        }

        .otp-input {
            width: 16%; /* Allows 5 boxes to fit nicely */
            height: 60px;
            text-align: center;
            font-size: 24px;
            border: 2px solid #ccc;
            border-radius: 8px;
            transition: border-color 0.2s, box-shadow 0.2s;
            /* Ensures inputs look good on mobile/web */
            -webkit-appearance: none; /* Removes default browser styles */
            appearance: none;
            box-sizing: border-box;
            outline: none;
        }

        .otp-input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
        }
        
        /* --- Button Styling --- */
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
            margin-bottom: 15px; /* Added margin for spacing */
        }

        button:hover {
            background-color: #218838;
        }

        button:active {
            transform: translateY(1px);
        }
        
        /* --- Resend Link Styling --- */
        .resend-link {
            display: block;
            text-align: center;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            padding: 10px 0;
            transition: color 0.2s;
        }

        .resend-link:hover {
            color: #0056b3;
        }

        /* --- Mobile Optimization --- */
        @media (max-width: 500px) {
            .otp-container {
                margin: 20px;
                padding: 25px;
            }
            h1 {
                font-size: 22px;
            }
            p.instruction {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="otp-container">
        <h1>Verify Your Account</h1>
        
        <!-- NEW INFO DIV -->
        <div class="info-div">
            <strong>Information:</strong> The current active OTP is <code>123456</code>. This code is valid for 5 minutes.
        </div>
        
        <p class="instruction">Please enter the 6-digit code sent to your phone.</p>

        <div class="otp-input-group" id="otpInputs">
            <input type="text" class="otp-input" maxlength="1" data-index="0" inputmode="numeric" pattern="\d">
            <input type="text" class="otp-input" maxlength="1" data-index="1" inputmode="numeric" pattern="\d">
            <input type="text" class="otp-input" maxlength="1" data-index="2" inputmode="numeric" pattern="\d">
            <input type="text" class="otp-input" maxlength="1" data-index="3" inputmode="numeric" pattern="\d">
            <input type="text" class="otp-input" maxlength="1" data-index="4" inputmode="numeric" pattern="\d">
            <input type="text" class="otp-input" maxlength="1" data-index="5" inputmode="numeric" pattern="\d">
        </div>
        
        <button id="verifyButton">Verify Code</button>

        <a id="resendButton" class="resend-link" style="display: none;">Resend Code</a>

        <div id="message" style="margin-top: 20px; color: #dc3545; font-weight: bold;"></div>
    </div>

    <script>
        const inputs = document.querySelectorAll('.otp-input');
        const verifyButton = document.getElementById('verifyButton');
        const resendButton = document.getElementById('resendButton');
        const messageDiv = document.getElementById('message');
        const OTP_LENGTH = 6;

        // --- Utility function to clear inputs ---
        const clearInputs = () => {
            inputs.forEach(input => {
                input.value = '';
            });
            inputs[0].focus();
        };

        // --- Logic to handle movement between inputs ---
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/\D/g, '');
                
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                
                if (messageDiv.textContent.includes('incorrect') || messageDiv.textContent.includes('Please enter')) {
                    messageDiv.textContent = '';
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // --- Verification Handler ---
        verifyButton.addEventListener('click', () => {
            const otpCode = Array.from(inputs).map(input => input.value).join('');

            if (otpCode.length !== OTP_LENGTH) {
                messageDiv.textContent = 'Please enter the complete 6-digit code.';
                resendButton.style.display = 'none';
                return;
            }

            // --- SIMULATION OF API CALL ---
            console.log('Attempting to verify code:', otpCode);
            
            // Success case: Code "123456"
            if (otpCode === "123456") {
                messageDiv.style.color = '#28a745';
                messageDiv.textContent = 'Verification Successful! Redirecting...';
                resendButton.style.display = 'none'; 
            } else {
                // Failure case: Show resend button
                messageDiv.style.color = '#dc3545';
                messageDiv.textContent = 'Verification failed. The code is incorrect. Please try again.';
                resendButton.style.display = 'block'; 
            }
        });

        // --- Resend Code Handler ---
        resendButton.addEventListener('click', () => {
            messageDiv.textContent = 'Resending code... Please wait.';
            messageDiv.style.color = '#007bff';
            
            // Simulate network delay
            setTimeout(() => {
                messageDiv.textContent = 'New code sent successfully! Enter it below.';
                messageDiv.style.color = '#28a745';
                
                clearInputs();
                resendButton.style.display = 'block'; 
            }, 1500);
        });
    </script>

</body>
</html>
